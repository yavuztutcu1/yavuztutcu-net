backend:
  name: github
  repo: yavuztutcu1/yavuztutcu-net
  branch: main
  base_url: https://decap-bridge.vercel.app
  auth_endpoint: /api/auth

publish_mode: editorial_workflow

media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  - name: "blog"
    label: "Haberler / Yazılar"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Yayınlanma Tarihi", name: "pubDatetime", widget: "datetime" }
      - { label: "Açıklama / Özet", name: "description", widget: "string" }
      - { label: "Yazar", name: "author", widget: "string", default: "Yavuz Miraç Tutcu" }
      - { label: "Öne Çıkan Görsel", name: "coverImage", widget: "image", required: false }
      - { label: "Etiketler", name: "tags", widget: "list", default: ["genel"] }
      - { label: "İçerik", name: "body", widget: "markdown" }
